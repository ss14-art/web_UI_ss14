<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA SYSTEMS</title>
    <link rel="stylesheet" href="/src/styles/variables.css">
    <link rel="stylesheet" href="/src/styles/base.css">
    <link rel="stylesheet" href="/src/styles/animations.css">
    <link rel="stylesheet" href="/src/styles/utilities.css">
    <link rel="stylesheet" href="/src/styles/components/index-terminal.css">
</head>
<body>
<div class="terminal-container">
    <div class="boot-sequence">
        <div class="system-header">NOVA SYSTEMS V0.0.0</div>
        <div class="system-info">
            BOOT SEQUENCE COMPLETE<br>
            SYSTEM READY<br>
            INTERFACE MODULES LOADED
        </div>
    </div>

    <div class="module-list">
        <div class="module-header">
            <span>AVAILABLE MODULES</span>
            <span id="module-count">SCANNING...</span>
        </div>
        <div id="interfaces-container">
            <div class="loading">
                <div>SCANNING INTERFACE MODULES</div>
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
                <div>PLEASE WAIT...</div>
            </div>
        </div>
    </div>

    <div class="system-stats" id="system-stats" style="display: none;">
        <div class="stat-item">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">TOTAL</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-active">0</div>
            <div class="stat-label">ACTIVE</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-dev">0</div>
            <div class="stat-label">DEVELOPMENT</div>
        </div>
    </div>
</div>

<script type="module">
    async function loadInterfaces() {
        const container = document.getElementById('interfaces-container');
        const moduleCount = document.getElementById('module-count');
        const systemStats = document.getElementById('system-stats');

        await new Promise(resolve => setTimeout(resolve, 1000));

        try {
            const response = await fetch('/api/interfaces');
            if (!response.ok) {
                return Promise.reject(new Error('Connection failed'));
            }

            const data = await response.json();

            if (data.interfaces.length === 0) {
                container.innerHTML = `
                        <div class="loading">
                            <div>NO MODULES DETECTED</div>
                            <div class="text-danger" style="margin-top: 10px;">SYSTEM ERROR</div>
                        </div>
                    `;
                moduleCount.textContent = 'ERROR';
                return;
            }

            const interfacesHtml = data.interfaces.map(face => {
                const isDisabled = face.status === 'deprecated';
                const statusClass = face.status === 'development' ? 'dev' :
                    face.status === 'deprecated' ? 'error' : '';

                const itemHtml = `
                        <div class="module-icon">${face.icon}</div>
                        <div class="module-details">
                            <div class="module-name">${face.title}</div>
                            <div class="module-desc">${face.description}</div>
                        </div>
                        <div class="module-status">
                            <span class="status-indicator ${statusClass}"></span>
                            <span class="status-text">${face.status.toUpperCase()}</span>
                        </div>
                    `;

                if (isDisabled) {
                    return `<div class="module-item disabled">${itemHtml}</div>`;
                }
                return `<a href="${face.url}" class="module-item">${itemHtml}</a>`;
            }).join('');

            container.innerHTML = `<div class="module-grid">${interfacesHtml}</div>`;

            const activeCount = data.interfaces.filter(i => i.status === 'active').length;
            const devCount = data.interfaces.filter(i => i.status === 'development').length;

            moduleCount.textContent = `${data.interfaces.length} MODULES`;
            systemStats.style.display = 'flex';

            document.getElementById('stat-total').textContent = data.interfaces.length.toString();
            document.getElementById('stat-active').textContent = activeCount.toString();
            document.getElementById('stat-dev').textContent = devCount.toString();

        } catch (error) {
            container.innerHTML = `
                    <div class="loading">
                        <div>CONNECTION FAILED</div>
                        <div class="text-danger" style="margin-top: 10px;">${error.message.toUpperCase()}</div>
                    </div>
                `;
            moduleCount.textContent = 'OFFLINE';
        }
    }

    loadInterfaces();
</script>
</body>
</html>
