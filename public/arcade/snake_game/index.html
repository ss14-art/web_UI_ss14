<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <script src="../adapter.js"></script>
    <link rel="stylesheet" href="../adapter.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
  /* =========================================================
     ПАЛИТРА — 2 цвета фосфора + почти чёрный фон (3 цвета)
     ========================================================= */
  :root {
    --fg:  #39ff88;   /* яркий фосфор   */
    --dim: #0d3a1e;   /* тёмный фосфор  */
    --bg:  #010402;   /* почти чёрный   */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: none;
  }

  body {
    font-family: "Courier New", Courier, ui-monospace, monospace;
    color: var(--fg);
    -webkit-font-smoothing: none;
    text-rendering: optimizeSpeed;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* =========================================================
     ЭКРАН: занимает ВСЮ площадь окна, без рамок и отступов
     ========================================================= */
  #screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;           /* мобильные браузеры */
    overflow: hidden;
    background: var(--bg);
    border-radius: clamp(16px, 3.2vmin, 64px);  /* маска кинескопа */
    animation: crtFlicker 7s infinite;
    will-change: opacity;
    transform: translateZ(0);
    cursor: none;
  }

  /* лёгкое деликатное дрожание яркости */
  @keyframes crtFlicker {
    0%, 100% { opacity: 1;    }
    6%       { opacity: .965; }
    7%       { opacity: 1;    }
    21%      { opacity: .982; }
    22%      { opacity: 1;    }
    53%      { opacity: .972; }
    55%      { opacity: 1;    }
    78%      { opacity: .987; }
    79%      { opacity: 1;    }
  }

  /* =========================================================
     CANVAS
     ========================================================= */
  #game {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    z-index: 1;
    image-rendering: pixelated;
  }

  /* =========================================================
     ОВЕРЛЕИ CRT
     ========================================================= */
  .ov {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
  }

  /* Виньетка + тёмная маска кинескопа по периметру */
  .vignette {
    z-index: 2;
    background: radial-gradient(
      ellipse 100% 100% at 50% 50%,
      rgba(0,0,0,0)    38%,
      rgba(0,0,0,.30)  66%,
      rgba(0,0,0,.78)  88%,
      rgba(0,0,0,.96) 100%
    );
    box-shadow:
      inset 0 0 10vmin 1.5vmin rgba(0,0,0,.55),
      inset 0 0 2.5vmin          rgba(0,0,0,.75);
  }

  /* Зерно: элемент больше экрана, двигаем transform — дёшево для GPU */
  .noise {
    position: absolute;
    inset: -10%;
    z-index: 3;
    pointer-events: none;
    background-image: var(--noise-url, none);
    background-repeat: repeat;
    background-size: 128px 128px;
    opacity: .07;
    mix-blend-mode: screen;
    animation: grain .6s steps(1, end) infinite;
    will-change: transform;
  }

  @keyframes grain {
    0%   { transform: translate3d(0, 0, 0);        }
    25%  { transform: translate3d(-37px, 19px, 0); }
    50%  { transform: translate3d(23px, -31px, 0); }
    75%  { transform: translate3d(-13px, -47px, 0);}
    100% { transform: translate3d(0, 0, 0);        }
  }

  /* Медленно ползущая полоса обновления кадра */
  .roll {
    z-index: 4;
    background-image: linear-gradient(
      to bottom,
      rgba(57,255,136,0)     0%,
      rgba(57,255,136,.018) 42%,
      rgba(57,255,136,.05)  50%,
      rgba(57,255,136,.018) 58%,
      rgba(57,255,136,0)   100%
    );
    background-repeat: no-repeat;
    background-size: 100% 30vh;
    animation: rollDown 7s linear infinite;
    will-change: background-position;
  }

  @keyframes rollDown {
    from { background-position: 0 -30vh; }
    to   { background-position: 0 100vh; }
  }

  /* Скан-линии: 1 тёмная линия каждые 3 px + пульсация */
  .scanlines {
    z-index: 5;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,.55) 0px,
      rgba(0,0,0,.55) 1px,
      rgba(0,0,0,0)   1px,
      rgba(0,0,0,0)   3px
    );
    animation: scanPulse 2.6s ease-in-out infinite;
    will-change: opacity;
  }

  @keyframes scanPulse {
    0%, 100% { opacity: .60; }
    50%      { opacity: .85; }
  }

  /* =========================================================
     СЧЁТ — единственный текст на экране
     ========================================================= */
  #score {
    position: absolute;
    z-index: 6;
    top: clamp(10px, 2.2vmin, 30px);
    left: clamp(12px, 2.6vmin, 36px);
    font-size: clamp(14px, 2.2vmin, 28px);
    line-height: 1;
    letter-spacing: .18em;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    text-shadow:
      0 0 4px  var(--fg),
      0 0 12px rgba(57,255,136,.80),
      0 0 26px rgba(57,255,136,.45);
  }
</style>
</head>
<body>

  <div id="screen">
    <canvas id="game"></canvas>
    <div class="ov vignette"></div>
    <div class="noise"></div>
    <div class="ov roll"></div>
    <div class="ov scanlines"></div>
    <div id="score">0</div>
  </div>

<script>
(function () {
  'use strict';

  /* =========================================================
     ПАЛИТРА (используется только в canvas)
     ========================================================= */
  const C_BG  = '#010402';  // почти чёрный с оттенком фосфора
  const C_FG  = '#39ff88';  // яркий зелёный фосфор
  const C_DIM = '#0d3a1e';  // тёмно-зелёный (сетка)

  /* =========================================================
     КОНСТАНТЫ
     ========================================================= */
  const TICK_MS     = 110;      // шаг игрового времени, мс
  const START_LEN   = 3;        // начальная длина змейки
  const DEATH_PAUSE = 1000;     // пауза после проигрыша, мс
  const BLINK_MS    = 100;      // период мигания поля, мс
  const MAX_DT      = 250;      // защита от «прыжков» времени
  const WARP_K      = 0.20;     // сила выпуклости ЭЛТ (barrel)
  const CELL_MIN    = 16;       // мин. размер клетки, px
  const CELL_MAX    = 46;       // макс. размер клетки, px
  const MAX_PIXELS  = 4.2e6;    // лимит backing store (FPS)

  /* =========================================================
     DOM
     ========================================================= */
  const screenEl = document.getElementById('screen');
  const canvas   = document.getElementById('game');
  const ctx      = canvas.getContext('2d', { alpha: false });
  const scoreEl  = document.getElementById('score');

  /* Кэш сетки: перерисовывается только при ресайзе */
  const gridCanvas = document.createElement('canvas');
  const gridCtx    = gridCanvas.getContext('2d');

  /* =========================================================
     ГЕОМЕТРИЯ СЕТКИ
     ========================================================= */
  let W = 1, H = 1, dpr = 1;
  let cols = 0, rows = 0;
  let cellW = 1, cellH = 1;

  /* =========================================================
     СОСТОЯНИЕ ИГРЫ
     ========================================================= */
  let snake      = [];                  // [0] — голова
  let dir        = { x: 1, y: 0 };      // текущее направление
  let pendingDir = { x: 1, y: 0 };      // направление на следующий шаг
  let food       = null;                // { x, y } | null
  let score      = 0;
  let state      = 'idle';              // 'idle' | 'running' | 'dying'
  let deathAt    = 0;
  let grace      = 0;                   // тики без проверки самостолкновения
  let acc        = 0;
  let lastTime   = 0;

  /* =========================================================
     ЭЛТ-ГЕОМЕТРИЯ (выпуклость)
     Граница экрана остаётся на месте, внутренняя часть «вздувается».
     ========================================================= */
  function warp(x, y) {
    const cx = W * 0.5;
    const cy = H * 0.5;
    const u = (x - cx) / cx;            // -1 .. 1
    const v = (y - cy) / cy;            // -1 .. 1
    const m = Math.max(Math.abs(u), Math.abs(v));
    const f = 1 + WARP_K * (1 - m * m); // 1 у краёв, 1+K в центре
    return [cx + u * f * cx, cy + v * f * cy];
  }

  /* =========================================================
     ПЕРЕСЧЁТ СЕТКИ ПОД ОКНО
     ========================================================= */
  function computeGrid() {
    const rect = screenEl.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));

    /* Целевой размер клетки под текущее окно */
    const base   = Math.min(W, H);
    const target = Math.max(CELL_MIN, Math.min(CELL_MAX, base / 24));

    cols = Math.max(8, Math.round(W / target));
    rows = Math.max(8, Math.round(H / target));

    /* Клетки заполняют экран ровно, без чёрных полос */
    cellW = W / cols;
    cellH = H / rows;

    /* Backing store с ограничением по площади (FPS) */
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const px = W * H * dpr * dpr;
    if (px > MAX_PIXELS) dpr = Math.sqrt(MAX_PIXELS / (W * H));
    dpr = Math.max(0.75, dpr);

    canvas.width  = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;

    buildGrid();
  }

  /* =========================================================
     СЕТКА (кэш, рисуется один раз на ресайз)
     ========================================================= */
  function buildGrid() {
    gridCanvas.width  = Math.max(1, Math.round(W * dpr));
    gridCanvas.height = Math.max(1, Math.round(H * dpr));
    gridCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    gridCtx.clearRect(0, 0, W, H);

    gridCtx.lineWidth   = 1;
    gridCtx.lineJoin    = 'round';
    gridCtx.strokeStyle = C_DIM;

    gridCtx.beginPath();

    /* Вертикальные линии (ломаные по границам клеток — повторяют изгиб) */
    for (let i = 0; i <= cols; i++) {
      const x = i * cellW;
      let p = warp(x, 0);
      gridCtx.moveTo(p[0], p[1]);
      for (let j = 1; j <= rows; j++) {
        p = warp(x, j * cellH);
        gridCtx.lineTo(p[0], p[1]);
      }
    }

    /* Горизонтальные линии */
    for (let j = 0; j <= rows; j++) {
      const y = j * cellH;
      let p = warp(0, y);
      gridCtx.moveTo(p[0], p[1]);
      for (let i = 1; i <= cols; i++) {
        p = warp(i * cellW, y);
        gridCtx.lineTo(p[0], p[1]);
      }
    }

    gridCtx.stroke();
  }

  /* =========================================================
     ИГРОВАЯ ЛОГИКА
     ========================================================= */

  function isFree(x, y) {
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === x && snake[i].y === y) return false;
    }
    return true;
  }

  function spawnFood() {
    const free = [];
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        if (isFree(x, y)) free.push({ x: x, y: y });
      }
    }
    if (free.length === 0) return null;
    return free[(Math.random() * free.length) | 0];
  }

  /* Стартовое состояние: змейка стоит, игра ждёт ввода */
  function resetToIdle() {
    const cx = cols >> 1;
    const cy = rows >> 1;

    snake = [];
    for (let i = 0; i < START_LEN; i++) {
      snake.push({ x: Math.max(0, cx - i), y: cy });
    }

    dir        = { x: 1, y: 0 };
    pendingDir = { x: 1, y: 0 };

    score = 0;
    scoreEl.textContent = '0';

    state = 'idle';
    acc   = 0;
    grace = 0;

    food = spawnFood();
  }

  function die() {
    state   = 'dying';
    deathAt = performance.now();
  }

  function step() {
    dir = pendingDir;

    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    /* Стена */
    if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) {
      die();
      return;
    }

    /* Своё тело (последний сегмент уйдёт — его не проверяем) */
    if (grace > 0) {
      grace--;
    } else {
      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === nx && snake[i].y === ny) {
          die();
          return;
        }
      }
    }

    snake.unshift({ x: nx, y: ny });

    if (food && nx === food.x && ny === food.y) {
      /* Съели: длина +1, счёт +1 */
      score++;
      scoreEl.textContent = String(score);
      food = spawnFood();
    } else {
      snake.pop();
    }
  }

  /* =========================================================
     ОТРИСОВКА
     ========================================================= */

  /* Добавляет в Path2D четырёхугольник клетки с учётом ЭЛТ-искажения */
  function addWarpedQuad(path, x0, y0, x1, y1) {
    const a = warp(x0, y0);
    const b = warp(x1, y0);
    const c = warp(x1, y1);
    const d = warp(x0, y1);
    path.moveTo(a[0], a[1]);
    path.lineTo(b[0], b[1]);
    path.lineTo(c[0], c[1]);
    path.lineTo(d[0], d[1]);
    path.closePath();
  }

  function drawSnake() {
    const pad = Math.max(0.8, Math.min(cellW, cellH) * 0.09);
    const path = new Path2D();

    for (let i = 0; i < snake.length; i++) {
      const s = snake[i];
      addWarpedQuad(
        path,
        s.x * cellW + pad,
        s.y * cellH + pad,
        (s.x + 1) * cellW - pad,
        (s.y + 1) * cellH - pad
      );
    }

    /* Хроматическая аберрация: еле заметные смещённые «двойники» */
    ctx.save();
    ctx.fillStyle   = C_FG;
    ctx.globalAlpha = 0.22;
    ctx.translate(1.6, 0);
    ctx.fill(path);
    ctx.globalAlpha = 0.13;
    ctx.translate(-3.2, 0);
    ctx.fill(path);
    ctx.restore();

    /* Основное тело + свечение фосфора */
    ctx.save();
    ctx.shadowColor = C_FG;
    ctx.shadowBlur  = 14;
    ctx.fillStyle   = C_FG;
    ctx.fill(path);
    ctx.restore();
  }

  function drawFood() {
    if (!food) return;

    const cx = (food.x + 0.5) * cellW;
    const cy = (food.y + 0.5) * cellH;
    const r  = Math.min(cellW, cellH) * 0.30;

    const p0 = warp(cx,     cy - r);
    const p1 = warp(cx + r, cy    );
    const p2 = warp(cx,     cy + r);
    const p3 = warp(cx - r, cy    );

    const path = new Path2D();
    path.moveTo(p0[0], p0[1]);
    path.lineTo(p1[0], p1[1]);
    path.lineTo(p2[0], p2[1]);
    path.lineTo(p3[0], p3[1]);
    path.closePath();

    ctx.save();
    ctx.shadowColor = C_FG;
    ctx.shadowBlur  = 18;
    ctx.fillStyle   = C_FG;
    ctx.fill(path);
    ctx.restore();
  }

  function render(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    /* Фон */
    ctx.fillStyle = C_BG;
    ctx.fillRect(0, 0, W, H);

    /* Кэшированная сетка (уже с искажением) */
    ctx.drawImage(gridCanvas, 0, 0, W, H);

    /* Мигание поля при проигрыше */
    if (state === 'dying' && (Math.floor((now - deathAt) / BLINK_MS) & 1)) {
      return;
    }

    drawFood();
    drawSnake();
  }

  /* =========================================================
     ГЛАВНЫЙ ЦИКЛ
     ========================================================= */
  function loop(now) {
    requestAnimationFrame(loop);

    if (lastTime === 0) lastTime = now;
    let dt = now - lastTime;
    lastTime = now;
    if (dt > MAX_DT) dt = MAX_DT;

    if (state === 'running') {
      acc += dt;
      while (acc >= TICK_MS && state === 'running') {
        acc -= TICK_MS;
        step();
      }
    } else {
      acc = 0;
    }

    if (state === 'dying' && now - deathAt >= DEATH_PAUSE) {
      resetToIdle();
    }

    render(now);
  }

  /* =========================================================
     УПРАВЛЕНИЕ
     ========================================================= */

  function handleDirection(nd) {
    if (state === 'idle') {
      /* Первое нажатие стрелки: старт + начальное направление */
      if (nd.x === -dir.x && nd.y === -dir.y) {
        snake.reverse();            // чтобы не убить себя на первом шаге
      }
      dir        = { x: nd.x, y: nd.y };
      pendingDir = { x: nd.x, y: nd.y };
      state      = 'running';
      acc        = 0;
      grace      = 0;
      return;
    }

    if (state !== 'running') return;

    /* Запрет разворота на 180° за один ход */
    if (nd.x === -pendingDir.x && nd.y === -pendingDir.y) return;

    pendingDir = { x: nd.x, y: nd.y };
  }

  window.addEventListener('keydown', function (e) {
    const code = e.code || '';

    /* Пробел — старт без смены направления */
    if (code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (state === 'idle') {
        state = 'running';
        acc   = 0;
        grace = 0;
      }
      return;
    }

    let nd = null;
    if      (code === 'ArrowUp'    || e.key === 'ArrowUp')    nd = { x:  0, y: -1 };
    else if (code === 'ArrowDown'  || e.key === 'ArrowDown')  nd = { x:  0, y:  1 };
    else if (code === 'ArrowLeft'  || e.key === 'ArrowLeft')  nd = { x: -1, y:  0 };
    else if (code === 'ArrowRight' || e.key === 'ArrowRight') nd = { x:  1, y:  0 };

    if (!nd) return;
    e.preventDefault();               // не скроллим страницу
    handleDirection(nd);
  }, { passive: false });

  /* =========================================================
     РЕСАЙЗ: пересчёт сетки + сохранение позиций
     ========================================================= */
  function remapState(oldCols, oldRows) {
    const sx = cols / oldCols;
    const sy = rows / oldRows;

    const seen = new Set();
    const ns   = [];

    for (let i = 0; i < snake.length; i++) {
      const s = snake[i];
      const x = Math.min(cols - 1, Math.max(0, Math.floor(s.x * sx)));
      const y = Math.min(rows - 1, Math.max(0, Math.floor(s.y * sy)));
      const key = x + ',' + y;
      if (seen.has(key)) continue;
      seen.add(key);
      ns.push({ x: x, y: y });
    }

    if (ns.length === 0) { resetToIdle(); return; }

    snake = ns;

    if (food) {
      const fx = Math.min(cols - 1, Math.max(0, Math.floor(food.x * sx)));
      const fy = Math.min(rows - 1, Math.max(0, Math.floor(food.y * sy)));
      food = seen.has(fx + ',' + fy) ? spawnFood() : { x: fx, y: fy };
    } else {
      food = spawnFood();
    }

    /* Даём фору: после перестройки сетки не убиваем себя мгновенно */
    grace = 2;
  }

  let resizeTimer = 0;
  function handleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      const oldCols = cols;
      const oldRows = rows;
      const wasRunning = (state === 'running');

      computeGrid();

      if (wasRunning && oldCols > 0 && oldRows > 0) {
        remapState(oldCols, oldRows);
      } else {
        resetToIdle();
      }
    }, 120);
  }

  window.addEventListener('resize', handleResize);
  window.addEventListener('orientationchange', handleResize);

  /* =========================================================
     ГЕНЕРАЦИЯ ЗЕРНА (без внешних картинок)
     ========================================================= */
  (function makeNoise() {
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;

    const g   = c.getContext('2d');
    const img = g.createImageData(S, S);
    const d   = img.data;

    for (let i = 0; i < d.length; i += 4) {
      d[i]     = 57;                       // R — цвет фосфора
      d[i + 1] = 255;                      // G
      d[i + 2] = 136;                      // B
      d[i + 3] = (Math.random() * 70) | 0; // A — случайная плотность
    }

    g.putImageData(img, 0, 0);
    document.documentElement.style.setProperty(
      '--noise-url',
      'url(' + c.toDataURL('image/png') + ')'
    );
  })();

  /* =========================================================
     СТАРТ
     ========================================================= */
  computeGrid();
  resetToIdle();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
